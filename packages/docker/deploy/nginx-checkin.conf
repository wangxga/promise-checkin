# Nginx 配置：checkin.itwxg.com HTTPS 反向代理
#
# 你的环境：Nginx 在宿主机上，已有 SSL 证书
# 后端在 Docker 里，暴露 3000 端口到宿主机
#
# 部署步骤：
#   1. 复制到 /etc/nginx/conf.d/checkin.conf（或 sites-available/ + 软链）
#   2. 把 ssl_certificate 路径改成你实际的证书路径
#   3. nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name checkin.itwxg.com;
    # HTTP → HTTPS 强制跳转
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name checkin.itwxg.com;

    # ====== SSL 证书（改成你的实际路径）======
    ssl_certificate     /etc/nginx/ssl/checkin.itwxg.com.pem;
    ssl_certificate_key /etc/nginx/ssl/checkin.itwxg.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 安全头
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    # 限流（防恶意刷接口）
    limit_req_zone $binary_remote_addr zone=checkin_api:10m rate=20r/s;

    # API 反向代理 → Docker 里的后端（宿主机 3000 端口）
    location /api/ {
        limit_req zone=checkin_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 健康检查（不限流，供监控用）
    location /health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    # 日志
    access_log /var/log/nginx/checkin-access.log;
    error_log  /var/log/nginx/checkin-error.log;
}
