<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>如约打卡 · Demo</title>
<style>
:root{
  --c-done:#34C759; --c-missed:#FF3B30; --c-pending:#C7C7CC; --c-today:#FF9500;
  --c-reschedule:#007AFF; --c-retroactive:#AF52DE; --c-overdue:#FFCC00;
  --c-bg:#FAFAFA; --c-card:#FFFFFF; --c-text:#1a1a1a; --c-text-2:#6b6b6b; --c-text-3:#ababab;
  --c-border:#EFEFEF; --c-border-2:#F5F5F5;
  --radius:14px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#e8e8e8;display:flex;justify-content:center;align-items:center;min-height:100vh;color:var(--c-text)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:15px}
.phone{width:390px;height:100vh;max-height:844px;background:var(--c-bg);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 50px rgba(0,0,0,.15)}
@media(min-width:500px){.phone{border-radius:44px;height:844px;border:9px solid #1a1a1a}}
.status-bar{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:14px;font-weight:600;flex-shrink:0;background:var(--c-bg)}
.status-bar .icons{display:flex;align-items:center;gap:5px;font-size:12px}
.header{height:44px;display:flex;align-items:center;padding:0 8px;flex-shrink:0;background:var(--c-bg)}
.header .back{font-size:22px;padding:8px;color:var(--c-text);line-height:1;width:36px;text-align:center}
.header .title{flex:1;text-align:center;font-size:17px;font-weight:600;letter-spacing:-.2px}
.header .action{font-size:15px;padding:8px 10px;color:var(--c-text-2);font-weight:500;min-width:36px}
.header .action.right{text-align:right}
.page{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px}
.page.no-tab{padding-bottom:40px}
.tabbar{height:62px;display:flex;background:var(--c-card);flex-shrink:0;border-top:.5px solid var(--c-border)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--c-text-3);font-size:10px;transition:color .15s;font-weight:500}
.tab svg{width:24px;height:24px;stroke-width:1.8}
.tab.active{color:var(--c-text)}
.card{background:var(--c-card);border-radius:var(--radius);margin:0 16px 12px;padding:18px}
.card.flush{padding:8px 0}
.section-label{font-size:13px;color:var(--c-text-3);padding:20px 20px 10px;font-weight:500;display:flex;align-items:center;justify-content:space-between;letter-spacing:.2px}
.section-label .count{font-size:12px;font-weight:400}
.section-label .add-plan{width:26px;height:26px;border-radius:50%;background:var(--c-text);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:18px;font-weight:300;line-height:1;cursor:pointer;margin-left:auto}
.btn{padding:11px 18px;border-radius:12px;font-size:15px;font-weight:500;transition:opacity .12s;white-space:nowrap}
.btn:active{opacity:.6}
.btn-fill{background:var(--c-text);color:#fff}
.btn-done{background:var(--c-done);color:#fff}
.btn-miss{color:var(--c-missed)}
.btn-ghost{background:var(--c-border-2);color:var(--c-text-2)}
.btn-block{display:block;width:100%;text-align:center;padding:14px;font-size:15px}
.btn-sm{padding:7px 14px;font-size:13px;border-radius:9px}
.pbar{height:5px;background:var(--c-border-2);border-radius:3px;overflow:hidden;margin-top:10px}
.pbar .fill{height:100%;border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:500}
.tag.done{background:rgba(52,199,89,.12);color:var(--c-done)}
.tag.miss{background:rgba(255,59,48,.1);color:var(--c-missed)}
.tag.pend{background:var(--c-border-2);color:var(--c-text-3)}
.tag.adj{background:rgba(0,122,255,.1);color:var(--c-reschedule)}
.tag.ret{background:rgba(175,82,222,.1);color:var(--c-retroactive)}
.row{display:flex;align-items:center;gap:13px;padding:14px 16px;background:var(--c-card);border-radius:var(--radius);cursor:pointer;transition:background .12s;position:relative}
.row+.row{margin-top:8px}
.row:active{background:var(--c-border-2)}
.rows{padding:0 16px}
.row .ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row .ic svg{width:22px;height:22px}
.row .main{flex:1;min-width:0}
.row .name{font-size:15px;font-weight:600;letter-spacing:-.1px}
.row .sub{font-size:12px;color:var(--c-text-3);margin-top:2px}
.row .end{flex-shrink:0;text-align:right}
.row .end .big{font-size:15px;font-weight:600;letter-spacing:-.2px}
.row .end .sml{font-size:11px;color:var(--c-text-3);margin-top:1px}
.summary{padding:24px 20px 20px;text-align:center}
.summary .s-name{font-size:20px;font-weight:700;letter-spacing:-.3px;margin-top:8px}
.summary .s-meta{font-size:12px;color:var(--c-text-3);margin-top:4px}
.summary .ic{width:56px;height:56px;border-radius:16px;margin:0 auto;display:flex;align-items:center;justify-content:center}
.summary .ic svg{width:30px;height:30px}
.tabs{display:flex;border-bottom:.5px solid var(--c-border);margin:0 16px}
.tab-item{flex:1;text-align:center;padding:12px 0;font-size:14px;font-weight:500;color:var(--c-text-3);position:relative;cursor:pointer}
.tab-item.active{color:var(--c-text);font-weight:600}
.tab-item.active::after{content:'';position:absolute;bottom:-.5px;left:50%;transform:translateX(-50%);width:24px;height:2.5px;background:var(--c-text);border-radius:2px}
.grid-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--c-border-2);border-radius:var(--radius);overflow:hidden;margin:0 16px 12px}
.gs-item{background:var(--c-card);padding:18px 16px}
.gs-item .n{font-size:26px;font-weight:700;letter-spacing:-.5px}
.gs-item .l{font-size:12px;color:var(--c-text-3);margin-top:3px}
.gs-item .extra{font-size:11px;color:var(--c-text-3);margin-top:2px}
.cal-head{display:flex;align-items:center;justify-content:center;gap:32px;padding:4px 0 12px}
.cal-head .month{font-size:15px;font-weight:600;min-width:96px;text-align:center}
.cal-head button{padding:6px 10px;color:var(--c-text-2);font-size:18px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.cal-grid .dow{text-align:center;font-size:11px;color:var(--c-text-3);padding:8px 0;font-weight:500}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;border-radius:10px;position:relative;cursor:pointer;gap:3px;color:var(--c-text)}
.cal-cell.empty{cursor:default}
.cal-cell.today{background:var(--c-text);color:#fff;font-weight:600}
.cal-cell:active:not(.empty):not(.today){background:var(--c-border-2)}
.cal-cell .dots{display:flex;gap:2px;height:5px}
.cal-cell .dots .d{width:5px;height:5px;border-radius:50%}
.cal-cell .corner{position:absolute;top:3px;right:4px;font-size:8px;font-weight:600}
.cal-legend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;padding:14px 16px 4px;font-size:11px;color:var(--c-text-3)}
.cal-legend span{display:inline-flex;align-items:center;gap:4px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:100}
.overlay.show{display:block}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:390px;max-width:100%;background:var(--c-card);border-radius:24px 24px 0 0;padding:12px 20px 36px;z-index:101;display:none;max-height:88vh;overflow-y:auto}
.sheet.show{display:block;animation:slideUp .28s cubic-bezier(.4,0,.2,1)}
@keyframes slideUp{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
.sheet .grip{width:36px;height:4px;background:var(--c-border);border-radius:2px;margin:0 auto 18px}
.sheet-title{font-size:17px;font-weight:600;text-align:center;margin-bottom:2px}
.sheet-sub{font-size:13px;color:var(--c-text-3);text-align:center;margin-bottom:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;background:var(--c-border-2);border-radius:20px;font-size:13px;color:var(--c-text-2);transition:all .12s}
.chip.sel{background:var(--c-text);color:#fff}
.fg{margin-bottom:22px}
.fl{font-size:14px;color:var(--c-text-2);margin-bottom:10px;font-weight:500}
.fi,.fta,.fsel{width:100%;padding:13px 14px;border:1px solid var(--c-border);border-radius:11px;font-size:15px;background:var(--c-card)}
.fta{resize:none;height:84px;line-height:1.5}
.fi:focus,.fta:focus,.fsel:focus{outline:none;border-color:var(--c-text)}
.frow{display:flex;gap:10px;align-items:center}
.ropts{display:flex;gap:8px;flex-wrap:wrap}
.ropt{flex:1;min-width:0;padding:13px;border:1.5px solid var(--c-border);border-radius:11px;text-align:center;font-size:14px;transition:all .15s;color:var(--c-text-2)}
.ropt.sel{border-color:var(--c-text);background:var(--c-text);color:#fff;font-weight:500}
.cgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.copt{aspect-ratio:1;border-radius:10px;cursor:pointer;border:2.5px solid transparent;transition:transform .1s}
.copt.sel{border-color:var(--c-text)}
.copt:active{transform:scale(.9)}
.steps{display:flex;justify-content:center;gap:6px;padding:4px 0 20px}
.steps .s{width:28px;height:3px;background:var(--c-border);border-radius:2px;transition:background .2s}
.steps .s.cur{background:var(--c-text)}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.92);background:rgba(0,0,0,.82);color:#fff;padding:13px 22px;border-radius:14px;font-size:14px;z-index:200;opacity:0;pointer-events:none;transition:all .2s;font-weight:500}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.empty{text-align:center;padding:80px 20px;color:var(--c-text-3)}
.empty svg{width:48px;height:48px;opacity:.4;margin-bottom:14px}
.empty .et{font-size:14px}
.li{display:flex;align-items:center;gap:13px;padding:15px 16px;background:var(--c-card)}
.li+.li{border-top:.5px solid var(--c-border-2)}
.li .lm{flex:1;min-width:0}
.li .lt{font-size:14px;font-weight:500}
.li .ls{font-size:12px;color:var(--c-text-3);margin-top:2px}
.collapse-head{display:flex;align-items:center;justify-content:space-between;padding:14px 0;color:var(--c-text-2);font-size:14px;cursor:pointer}
.collapse-head .arrow{transition:transform .2s;font-size:12px}
.collapse-head.open .arrow{transform:rotate(180deg)}
.flex{display:flex}.center{align-items:center}.between{justify-content:space-between}
.gap8{gap:8px}.gap12{gap:12px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.muted{color:var(--c-text-3)}.small{font-size:12px}.bold{font-weight:600}
.sparkline{width:100%;height:56px}
.switch{width:42px;height:25px;background:#d8d8d8;border-radius:13px;position:relative;transition:background .2s;cursor:pointer;flex-shrink:0}
.switch.on{background:var(--c-text)}
.switch::after{content:'';position:absolute;width:21px;height:21px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on::after{left:19px}
.hint{font-size:12px;color:var(--c-text-3);line-height:1.5;margin-top:8px}
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar"><span class="time">9:41</span><span class="icons"><span>●●●</span><span>📶</span><span>🔋</span></span></div>
  <div class="header" id="header"></div>
  <div class="page" id="page"></div>
  <div class="tabbar" id="tabbar" style="display:none">
    <div class="tab" data-route="home"></div>
    <div class="tab" data-route="checkin"></div>
    <div class="tab" data-route="me"></div>
  </div>
</div>
<div class="overlay" id="overlay"></div>
<div class="toast" id="toast"></div>
<script>
const $=(s,p=document)=>p.querySelector(s),$$=(s,p=document)=>[...p.querySelectorAll(s)];
const today=()=>new Date(),pad=n=>String(n).padStart(2,'0');
const fmtDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDate=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const isoWeekday=d=>d.getDay()===0?7:d.getDay();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const nowISO=()=>new Date().toISOString();
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1500);}
function vibrate(ms){if(navigator.vibrate)navigator.vibrate(ms);}
function hexA(hex,a){if(!hex||!hex.startsWith('#'))return hex;const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}
const TAB_ICONS={home:'<path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/>',checkin:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12.5l3 3 5-6"/>',me:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/>'};
const TYPE_ICONS={course:'<path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v15H5.5C4.7 19 4 18.3 4 17.5v-12z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13v15h5.5c.8 0 1.5-.7 1.5-1.5v-12z"/>',medicine:'<rect x="3" y="8" width="18" height="11" rx="3"/><path d="M12 8v11"/><path d="M8 13h2M14 13h2"/><path d="M9 8V5a2 2 0 012-2h2a2 2 0 012 2v3"/>',measure:'<path d="M3 17l5-6 4 4 5-7 4 4"/><path d="M3 20h18"/>',fitness:'<path d="M6.5 6.5l11 11"/><path d="M3.5 9.5l2-2 2 2-2 2z"/><path d="M16.5 6.5l2 2-2 2-2-2z"/><path d="M9.5 16.5l2 2-2 2-2-2z"/><path d="M18.5 13.5l2 2-2 2-2-2z"/>',learning:'<path d="M3 5c2-1 5-1 7 0v14c-2-1-5-1-7 0V5z"/><path d="M21 5c-2-1-5-1-7 0v14c2-1 5-1 7 0V5z"/>',custom:'<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.8 6.6 19.5l1.2-6L3.3 9.3l6.1-.7L12 3z"/>'};
function tabIcon(key){return`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${TAB_ICONS[key]}</svg>`}
function iconSvg(type,color,bg){const p=TYPE_ICONS[type]||TYPE_ICONS.custom;return`<div class="ic" style="background:${hexA(color,bg||.1)};color:${color}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg></div>`;}
const DB={plans:[],checkins:[],load(){try{const r=localStorage.getItem('pc_db');if(r){const d=JSON.parse(r);this.plans=d.plans||[];this.checkins=d.checkins||[];return true}}catch(e){}return false;},save(){localStorage.setItem('pc_db',JSON.stringify({plans:this.plans,checkins:this.checkins}));},getPlan(id){return this.plans.find(p=>p.id===id)},getCheckin(id){return this.checkins.find(c=>c.id===id)},activePlans(){return this.plans.filter(p=>!p.deletedAt)},planCheckins(pid){return this.checkins.filter(c=>c.planId===pid&&!c.deletedAt)}};
const TYPES={course:{label:'课程'},medicine:{label:'服药'},measure:{label:'测量'},fitness:{label:'运动'},learning:{label:'学习'},custom:{label:'自定义'}};
const COLORS=['#1a1a1a','#34C759','#007AFF','#AF52DE','#FF3B30','#FF9500','#5856D6','#00C7BE','#FF2D55','#5AC8FA','#FF6482','#3478F6'];
const ABSENCE_REASONS=['生病','外出','遗忘','有事','天气'];
function matchRule(date,rule){if(rule.weekday!==undefined)return isoWeekday(date)===rule.weekday;if(rule.every==='day')return true;return false;}
function generateSlots(plan,f,t){if(plan.timeMode!=='fixed'||!plan.scheduleConfig)return[];const rules=plan.scheduleConfig.rules||[];const slots=[];const d=new Date(f);while(d<=t){for(const r of rules){if(matchRule(d,r))slots.push({scheduledDate:fmtDate(d),scheduledTime:r.time||null})}d.setDate(d.getDate()+1)}return slots;}
function ensureSchedule(plan){if(plan.timeMode!=='fixed'||!plan.scheduleConfig)return;const start=plan.startDate?parseDate(plan.startDate):today();const end=addDays(today(),14);const slots=generateSlots(plan,start,end);const exist=new Set(DB.planCheckins(plan.id).map(c=>c.scheduledDate+'|'+(c.scheduledTime||'')));for(const s of slots){const k=s.scheduledDate+'|'+(s.scheduledTime||'');if(!exist.has(k)){DB.checkins.push({id:uid(),planId:plan.id,scheduledDate:s.scheduledDate,scheduledTime:s.scheduledTime,status:'pending',actualTime:null,value:null,remark:null,source:'scheduled',adjustmentType:null,originalScheduledDate:null,originalScheduledTime:null,createdAt:nowISO(),deletedAt:null});}}}
function totalDone(plan){return(plan.initialDoneCount||0)+(plan.doneCount||0)}
function syncPlanCounts(pid){const plan=DB.getPlan(pid);if(!plan)return;const cs=DB.planCheckins(pid);plan.doneCount=cs.filter(c=>c.status==='done').length;plan.missedCount=cs.filter(c=>c.status==='missed').length;if(plan.totalCount!==null&&plan.totalCount!==undefined){if(calcConsumed(plan)>=plan.totalCount&&plan.status==='active')plan.status='completed';}}
function syncAll(){DB.plans.forEach(p=>syncPlanCounts(p.id));}
function calcConsumed(plan){if(plan.totalCount===null||plan.totalCount===undefined)return null;return totalDone(plan)+(plan.absenceConsumes?plan.missedCount:0);}
function calcRemain(plan){if(plan.totalCount===null||plan.totalCount===undefined)return null;return plan.totalCount-calcConsumed(plan);}
function calcProgress(plan){if(plan.totalCount===null||plan.totalCount===undefined)return null;const c=calcConsumed(plan);return plan.totalCount>0?c/plan.totalCount:0;}
function processOverdue(){const now=today();let ch=false;for(const c of DB.checkins){if(c.deletedAt||c.status!=='pending')continue;const plan=DB.getPlan(c.planId);if(!plan||plan.overdueHandling!=='auto_missed')continue;const dt=parseDate(c.scheduledDate);if(c.scheduledTime){const[h,m]=c.scheduledTime.split(':').map(Number);dt.setHours(h,m,0,0);}else dt.setHours(23,59,59);dt.setHours(dt.getHours()+(plan.overdueGraceHours||24));if(now>dt){c.status='missed';c.remark=c.remark||'逾期未打卡（自动标记）';ch=true;}}if(ch)syncAll();}
function setStatus(cid,status,opts={}){const c=DB.getCheckin(cid);if(!c)return;c.status=status;c.actualTime=status==='done'?(opts.actualTime||nowISO()):null;if(opts.value!==undefined)c.value=opts.value;if(opts.remark!==undefined)c.remark=opts.remark;if(opts.source!==undefined)c.source=opts.source;if(opts.adjustmentType!==undefined)c.adjustmentType=opts.adjustmentType;syncPlanCounts(c.planId);DB.save();}
function rescheduleCheckin(cid,nd,nt){const c=DB.getCheckin(cid);if(!c)return;if(!c.originalScheduledDate){c.originalScheduledDate=c.scheduledDate;c.originalScheduledTime=c.scheduledTime;}c.scheduledDate=nd;c.scheduledTime=nt;c.adjustmentType='reschedule';DB.save();}
function retroactiveDone(pid,date,time){const plan=DB.getPlan(pid);if(!plan)return;let c=DB.planCheckins(pid).find(x=>x.scheduledDate===date&&(!time||(x.scheduledTime===time)));if(c){setStatus(c.id,'done',{source:'retroactive',adjustmentType:c.status==='missed'?'makeup':null,remark:c.remark});}else{DB.checkins.push({id:uid(),planId:pid,scheduledDate:date,scheduledTime:time||null,status:'done',actualTime:nowISO(),value:null,remark:null,source:'retroactive',adjustmentType:null,originalScheduledDate:null,originalScheduledTime:null,createdAt:nowISO(),deletedAt:null});syncPlanCounts(pid);DB.save();}}
function calcStreak(plan){const cs=DB.planCheckins(plan.id).filter(c=>c.status==='done');if(!cs.length)return 0;const doneSet=new Set(cs.map(c=>c.scheduledDate));const allSlots=DB.planCheckins(plan.id);const slotDays=[...new Set(allSlots.map(s=>s.scheduledDate))].sort();if(!slotDays.length)return 0;let streak=0;let d=parseDate(slotDays[slotDays.length-1]);const earliest=slotDays[0];while(fmtDate(d)>=earliest){const ds=fmtDate(d);if(allSlots.some(s=>s.scheduledDate===ds)&&!doneSet.has(ds))break;if(doneSet.has(ds))streak++;d=addDays(d,-1);}return streak;}
function todayOverview(){const ts=fmtDate(today());const todos=[],dones=[];for(const plan of DB.activePlans()){if(plan.status!=='active')continue;for(const c of DB.planCheckins(plan.id).filter(c=>c.scheduledDate===ts)){if(c.status==='pending')todos.push({plan,checkin:c});else if(c.status==='done')dones.push({plan,checkin:c});}}todos.sort((a,b)=>(a.checkin.scheduledTime||'').localeCompare(b.checkin.scheduledTime||''));return{todos,dones};}
function allMissed(){const list=[];for(const plan of DB.activePlans())for(const c of DB.planCheckins(plan.id))if(c.status==='missed')list.push({plan,checkin:c});return list.sort((a,b)=>b.checkin.scheduledDate.localeCompare(a.checkin.scheduledDate));}
function viewHome(){const ov=todayOverview();const all=[...ov.todos,...ov.dones];let h=`<div class="section-label">今日打卡 <span class="count">${all.length} 项 · ${ov.todos.length} 待打</span></div>`;if(!all.length){h+=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="et">今天没有打卡任务</div></div>`;return h}h+=`<div class="rows">`;for(const {plan,checkin} of all){const done=checkin.status==='done';h+=`<div class="row" ${done?'style="opacity:.55"':''} onclick="${done?`openSheet('${checkin.id}')`:`quickDone('${checkin.id}')`}">${iconSvg(plan.type,plan.color)}<div class="main"><div class="name">${plan.name}</div><div class="sub">${checkin.scheduledTime||'今日'} · ${done?'已完成':'待打卡'}${checkin.source==='retroactive'?' · 补录':''}</div></div>${done?`<span class="tag done">已完成</span>`:`<button class="btn btn-done btn-sm" onclick="event.stopPropagation();quickDone('${checkin.id}')">打卡</button><button class="btn btn-ghost btn-sm" style="margin-left:6px" onclick="event.stopPropagation();openSheet('${checkin.id}')">⋯</button>`}</div>`;}h+=`</div>`;const mc=allMissed().length;if(mc)h+=`<div style="padding:16px"><button class="btn btn-ghost btn-block" onclick="go('missed')">查看 ${mc} 条缺席记录</button></div>`;return h;}
function planCard(plan){let endHtml;if(plan.totalCount!==null){const consumed=calcConsumed(plan),remain=calcRemain(plan),prog=calcProgress(plan);endHtml=`<div class="end"><div class="big">剩 ${remain}</div><div class="sml">${consumed}/${plan.totalCount}</div></div><div style="position:absolute;left:53px;right:16px;bottom:8px"><div class="pbar"><div class="fill" style="width:${Math.min(prog*100,100)}%;background:${plan.color}"></div></div></div>`;}else{endHtml=`<div class="end"><div class="big">${totalDone(plan)}</div><div class="sml">已完成</div></div>`;}return`<div class="row" style="padding-bottom:22px" onclick="go('plan/${plan.id}')">${iconSvg(plan.type,plan.color)}<div class="main"><div class="name">${plan.name}</div><div class="sub">${TYPES[plan.type].label}${plan.initialDoneCount?` · 起始 ${plan.initialDoneCount}`:''}</div></div>${endHtml}</div>`;}
let calMonth=null,detailTab='progress';
function viewDetail(id){const plan=DB.getPlan(id);if(!plan)return'<div class="empty">计划不存在</div>';ensureSchedule(plan);syncPlanCounts(id);if(!calMonth){const d=today();calMonth=`${d.getFullYear()}-${pad(d.getMonth()+1)}`}let h=`<div class="summary">${iconSvg(plan.type,plan.color,.12)}<div class="s-name">${plan.name}</div><div class="s-meta">${TYPES[plan.type].label}${plan.remark?` · ${plan.remark}`:''}</div></div>`;h+=`<div class="tabs"><div class="tab-item ${detailTab==='progress'?'active':''}" onclick="setDetailTab('progress')">进度</div><div class="tab-item ${detailTab==='calendar'?'active':''}" onclick="setDetailTab('calendar')">日历</div><div class="tab-item ${detailTab==='records'?'active':''}" onclick="setDetailTab('records')">记录</div></div>`;if(detailTab==='progress')h+=detailProgress(plan);else if(detailTab==='calendar')h+=renderCalendar(plan,calMonth);else h+=detailRecords(plan);return h;}
function setDetailTab(t){detailTab=t;rerender();}
function detailProgress(plan){const consumed=calcConsumed(plan),remain=calcRemain(plan);let h=`<div class="grid-stats">`;h+=`<div class="gs-item"><div class="n" style="color:var(--c-done)">${totalDone(plan)}</div><div class="l">已完成</div>${plan.initialDoneCount?`<div class="extra">含起始 ${plan.initialDoneCount}</div>`:''}</div>`;h+=`<div class="gs-item"><div class="n" style="color:var(--c-missed)">${plan.missedCount}</div><div class="l">缺席</div></div>`;if(plan.totalCount!==null){h+=`<div class="gs-item"><div class="n">${consumed}<span style="font-size:15px;color:var(--c-text-3)">/${plan.totalCount}</span></div><div class="l">已消耗配额</div><div class="extra">${plan.absenceConsumes?'含缺席计入':'仅完成计入'}</div></div>`;h+=`<div class="gs-item"><div class="n" style="color:${plan.color}">${remain}</div><div class="l">剩余配额</div></div>`;}else{h+=`<div class="gs-item"><div class="n muted">∞</div><div class="l">无限计划</div></div>`;h+=`<div class="gs-item"><div class="n">${calcStreak(plan)}</div><div class="l">连续天数</div></div>`;}h+=`</div>`;if(plan.recordValue){const vals=DB.planCheckins(plan.id).filter(c=>c.status==='done'&&c.value!==null).sort((a,b)=>a.scheduledDate.localeCompare(b.scheduledDate)).slice(-14).map(c=>parseFloat(c.value));if(vals.length>=2)h+=`<div class="card"><div class="fl">近 ${vals.length} 次趋势 ${plan.valueUnit?'('+plan.valueUnit+')':''}</div><div class="mt8">${sparkline(vals,plan.color)}</div></div>`;}h+=`<div class="card flush">`;h+=statRow('连续打卡',calcStreak(plan)+' 天');const cs=DB.planCheckins(plan.id);const done=cs.filter(c=>c.status==='done').length,missed=cs.filter(c=>c.status==='missed').length,rated=done+missed;h+=statRow('完成率',rated?Math.round(done/rated*100)+'%':'—','已处理记录中完成占比');if(plan.totalCount!==null&&plan.timeMode==='fixed'){const rules=(plan.scheduleConfig&&plan.scheduleConfig.rules)||[];if(remain>0&&rules.length){const weeks=Math.ceil(remain/rules.length);h+=statRow('预计完成',fmtDate(addDays(today(),weeks*7)),'按当前排期节奏');}}h+=`</div>`;return h;}
function statRow(label,val,sub){return`<div class="li"><div class="lm"><div class="lt">${label}</div>${sub?`<div class="ls">${sub}</div>`:''}</div><div style="font-size:17px;font-weight:600">${val}</div></div>`;}
function detailRecords(plan){const id=plan.id;const missed=DB.planCheckins(id).filter(c=>c.status==='missed').sort((a,b)=>b.scheduledDate.localeCompare(a.scheduledDate));let h=`<div style="padding:12px 16px"><button class="btn btn-ghost btn-block" onclick="openRetro('${id}')">+ 补录过去某天</button></div>`;h+=`<div class="section-label">缺席记录 <span class="count">${missed.length}</span></div>`;if(!missed.length){h+=`<div class="empty"><div class="et">暂无缺席</div></div>`;return h}h+=`<div style="padding:0 16px"><div class="card flush">`;for(const c of missed){const adj=c.adjustmentType==='makeup'?'<span class="tag ret">已补</span>':`<span class="tag miss">缺</span>`;h+=`<div class="li" onclick="openSheet('${c.id}')"><span class="dot" style="background:var(--c-missed)"></span><div class="lm"><div class="lt">${c.scheduledDate} ${c.scheduledTime||''}</div><div class="ls">${c.remark||'无备注'}</div></div>${adj}</div>`;}h+=`</div></div>`;return h;}
function renderCalendar(plan,month){const[y,m]=month.split('-').map(Number);const first=new Date(y,m-1,1);const firstDow=first.getDay()===0?6:first.getDay()-1;const daysInMonth=new Date(y,m,0).getDate();const todayStr=fmtDate(today());const cs=DB.planCheckins(plan.id);let h=`<div class="card"><div class="cal-head"><button onclick="prevMonth()">‹</button><span class="month">${y}年${m}月</span><button onclick="nextMonth()">›</button></div><div class="cal-grid">`;for(const dw of['一','二','三','四','五','六','日'])h+=`<div class="dow">${dw}</div>`;for(let i=0;i<firstDow;i++)h+=`<div class="cal-cell empty"></div>`;for(let d=1;d<=daysInMonth;d++){const ds=`${y}-${pad(m)}-${pad(d)}`;const dayCs=cs.filter(c=>c.scheduledDate===ds);const isToday=ds===todayStr;let dots='',corner='';if(dayCs.length){dots=`<div class="dots">${dayCs.slice(0,3).map(c=>`<span class="d" style="background:${c.status==='done'?'var(--c-done)':c.status==='missed'?'var(--c-missed)':'rgba(255,255,255,.6)'}"></span>`).join('')}</div>`;}if(dayCs.some(c=>c.adjustmentType==='reschedule'))corner=`<span class="corner" style="color:var(--c-reschedule)">改</span>`;else if(dayCs.some(c=>c.source==='retroactive'))corner=`<span class="corner" style="color:var(--c-retroactive)">补</span>`;h+=`<div class="cal-cell ${isToday?'today':''}" onclick="openDay('${plan.id}','${ds}')">${d}${dots}${corner}</div>`;}h+=`</div></div>`;h+=`<div class="cal-legend"><span><span class="dot" style="background:var(--c-done)"></span>完成</span><span><span class="dot" style="background:var(--c-missed)"></span>缺席</span><span><span class="dot" style="background:var(--c-today)"></span>今日</span><span style="color:var(--c-reschedule)">改 调整</span><span style="color:var(--c-retroactive)">补 补录</span></div>`;return h;}
function prevMonth(){const[y,m]=calMonth.split('-').map(Number);const d=new Date(y,m-2,1);calMonth=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;rerender();}
function nextMonth(){const[y,m]=calMonth.split('-').map(Number);const d=new Date(y,m,1);calMonth=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;rerender();}
function sparkline(values,color){const w=300,h=56,pad=8;const min=Math.min(...values),max=Math.max(...values),range=max-min||1;const pts=values.map((v,i)=>{const x=pad+(i/(values.length-1))*(w-pad*2);const y=h-pad-((v-min)/range)*(h-pad*2);return[x,y];});const path=pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');const area=path+` L${pts[pts.length-1][0].toFixed(1)} ${h-pad} L${pts[0][0].toFixed(1)} ${h-pad} Z`;return`<svg class="sparkline" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${area}" fill="${hexA(color,.12)}"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="${color}"/>`).join('')}</svg>`;}
function viewCheckin(){const plans=DB.activePlans().filter(p=>p.status==='active');let h=`<div class="section-label">我的计划 <span class="count">${plans.length} 个进行中</span><span class="add-plan" onclick="go('new')">+</span></div>`;if(plans.length){h+=`<div class="rows">`;for(const p of plans)h+=planCard(p);h+=`</div>`;}else{h+=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M9 11l3 3 8-8" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2h11" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="et">还没有计划</div><button class="btn btn-fill btn-sm mt16" onclick="go('new')">新建计划</button></div>`;}const archived=DB.activePlans().filter(p=>p.status==='completed');if(archived.length){h+=`<div class="section-label">已完成 <span class="count">${archived.length} 个</span></div><div class="rows">`;for(const p of archived)h+=planCard(p);h+=`</div>`;}return h;}
function viewMissed(){const list=allMissed();let h=`<div class="section-label">全部缺席 <span class="count">${list.length} 条</span></div>`;if(!list.length){h+=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="et">暂无缺席记录</div></div>`;return h}h+=`<div style="padding:0 16px"><div class="card flush">`;for(const {plan,checkin} of list){const isMakeup=checkin.adjustmentType==='makeup';h+=`<div class="li" onclick="openSheet('${checkin.id}')">${iconSvg(plan.type,plan.color)}<div class="lm"><div class="lt">${plan.name}</div><div class="ls">${checkin.scheduledDate} ${checkin.scheduledTime||''} · ${checkin.remark||'无备注'}</div></div>${isMakeup?`<span class="tag ret">已补</span>`:`<button class="btn btn-done btn-sm" onclick="event.stopPropagation();makeupDone('${checkin.id}')">补打</button>`}</div>`;}h+=`</div></div>`;return h;}
function viewMe(){let h=`<div class="section-label">概览</div>`;h+=`<div style="padding:0 16px"><div class="card flush">`;h+=statRow('进行中计划',DB.activePlans().filter(p=>p.status==='active').length+' 个');h+=statRow('打卡记录',DB.checkins.filter(c=>!c.deletedAt).length+' 条');h+=statRow('缺席待补',allMissed().filter(x=>x.checkin.adjustmentType!=='makeup').length+' 条');h+=`</div></div>`;h+=`<div class="section-label">数据</div>`;h+=`<div style="padding:0 16px"><div class="card flush"><div class="li" onclick="resetSample()" style="cursor:pointer"><div class="lm"><div class="lt">重置为示例数据</div></div><span class="muted">›</span></div><div class="li" onclick="clearAll()" style="cursor:pointer"><div class="lm"><div class="lt" style="color:var(--c-missed)">清空所有数据</div></div><span class="muted">›</span></div></div></div>`;h+=`<div class="card"><div class="fl">关于</div><div class="hint" style="margin-top:10px">「如约打卡」—— 通用按计划打卡 + 缺席追溯工具。把"课程/服药/测量"抽象成「计划 + 打卡」，一套机制覆盖所有定时重复场景。<br><br>本页为可交互 Demo，数据存浏览器本地。建模拟合点：多口径配额计数、起始进度、调整排期、事后补录、逾期自动处理。</div></div>`;return h;}
let formState={step:0};
function goStep(n){formState.step=n;rerender();}
function viewEdit(id){const isEdit=!!id;if(isEdit&&formState._id!==id){const p=DB.getPlan(id);const rules=(p.scheduleConfig&&p.scheduleConfig.rules)||[];const isWeek=rules.some(r=>r.weekday!==undefined);const weekdays=isWeek?[...new Set(rules.map(r=>r.weekday))]:[2,6];const times=isWeek?[...new Set(rules.map(r=>r.time))]:['18:00'];const everyDayTimes=!isWeek&&rules.length?[...new Set(rules.map(r=>r.time))]:['08:00'];formState={...p,_id:id,step:0,totalCountMode:p.totalCount===null?'unlimited':'limited',scheduleType:isWeek?'weekday':'everyday',weekdays,times,everyDayTimes,initialDoneCount:p.initialDoneCount||0};}else if(!isEdit&&!formState._init){formState={_init:true,step:0,name:'',type:'course',color:'#007AFF',totalCountMode:'limited',totalCount:60,initialDoneCount:0,absenceConsumes:0,timeMode:'fixed',scheduleType:'weekday',weekdays:[2,6],times:['18:00'],everyDayTimes:['08:00'],overdueHandling:'keep_pending',overdueGraceHours:24,recordValue:0,valueUnit:'',startDate:fmtDate(today()),remark:''};}let h=`<div class="steps">`;for(let i=0;i<4;i++)h+=`<div class="s ${i<=formState.step?'cur':''}"></div>`;h+=`</div>`;const s=formState.step;if(s===0)h+=stepBasic();else if(s===1)h+=stepQuota();else if(s===2)h+=stepTime();else h+=stepRemark(isEdit);return h;}
function stepBasic(){const f=formState;return`<div class="card"><div class="fg"><div class="fl">计划名称</div><input class="fi" value="${f.name||''}" placeholder="如：钢琴课、每日维生素" oninput="formState.name=this.value"></div><div class="fg"><div class="fl">类型</div><div class="ropts">${Object.entries(TYPES).map(([k,v])=>`<div class="ropt ${f.type===k?'sel':''}" onclick="formState.type='${k}';rerender()">${v.label}</div>`).join('')}</div></div><div class="fg"><div class="fl">主题色</div><div class="cgrid">${COLORS.map(c=>`<div class="copt ${f.color===c?'sel':''}" style="background:${c}" onclick="formState.color='${c}';rerender()"></div>`).join('')}</div><div class="hint">图标根据类型自动匹配</div><div style="margin-top:12px">${iconSvg(f.type,f.color)}</div></div></div><div style="padding:16px"><button class="btn btn-fill btn-block" onclick="goStep(1)">下一步</button></div>`;}
function stepQuota(){const f=formState;let h=`<div class="card"><div class="fg"><div class="fl">次数</div><div class="ropts"><div class="ropt ${f.totalCountMode==='limited'?'sel':''}" onclick="formState.totalCountMode='limited';rerender()">有限次数</div><div class="ropt ${f.totalCountMode==='unlimited'?'sel':''}" onclick="formState.totalCountMode='unlimited';rerender()">无限次</div></div></div>`;if(f.totalCountMode==='limited'){h+=`<div class="fg"><div class="fl">总次数</div><input type="number" class="fi" value="${f.totalCount||''}" oninput="formState.totalCount=parseInt(this.value)||0"></div>`;h+=`<div class="fg"><div class="fl">起始进度</div><input type="number" class="fi" value="${f.initialDoneCount||0}" min="0" oninput="formState.initialDoneCount=parseInt(this.value)||0"><div class="hint">如果这个计划已经开始过，填入之前已完成的次数。只影响进度展示，不会补造历史记录。</div></div>`;h+=`<div class="fg"><div class="fl">缺勤是否计入配额消耗</div><div class="frow"><div class="small muted" style="flex:1">开启后缺席也扣配额，关闭则只按实际完成计</div><div class="switch ${f.absenceConsumes?'on':''}" onclick="formState.absenceConsumes=formState.absenceConsumes?0:1;rerender()"></div></div></div>`;}h+=`<div class="fg"><div class="fl">逾期处理</div><div class="ropts"><div class="ropt ${f.overdueHandling==='keep_pending'?'sel':''}" onclick="formState.overdueHandling='keep_pending';rerender()">保留待处理</div><div class="ropt ${f.overdueHandling==='auto_missed'?'sel':''}" onclick="formState.overdueHandling='auto_missed';rerender()">自动标记缺席</div></div></div>`;if(f.overdueHandling==='auto_missed'){h+=`<div class="fg"><div class="fl">宽限期（小时）</div><input type="number" class="fi" value="${f.overdueGraceHours||24}" oninput="formState.overdueGraceHours=parseInt(this.value)||24"></div>`;}h+=`<div class="fg"><div class="fl">开始日期</div><input type="date" class="fi" value="${f.startDate||fmtDate(today())}" oninput="formState.startDate=this.value"></div></div>`;h+=`<div style="padding:16px;display:flex;gap:10px"><button class="btn btn-ghost" style="flex:1" onclick="goStep(0)">上一步</button><button class="btn btn-fill" style="flex:1" onclick="goStep(2)">下一步</button></div>`;return h;}
function stepTime(){const f=formState;let h=`<div class="card"><div class="fg"><div class="fl">时间模式</div><div class="ropts"><div class="ropt ${f.timeMode==='fixed'?'sel':''}" onclick="formState.timeMode='fixed';rerender()">固定排期</div><div class="ropt ${f.timeMode==='flexible'?'sel':''}" onclick="formState.timeMode='flexible';rerender()">不固定</div></div></div>`;if(f.timeMode==='fixed'){h+=`<div class="fg"><div class="fl">排期方式</div><div class="ropts"><div class="ropt ${f.scheduleType==='weekday'?'sel':''}" onclick="formState.scheduleType='weekday';rerender()">按周几</div><div class="ropt ${f.scheduleType==='everyday'?'sel':''}" onclick="formState.scheduleType='everyday';rerender()">每天定时</div></div></div>`;const dows=['','一','二','三','四','五','六','日'];if(f.scheduleType==='weekday'){h+=`<div class="fg"><div class="fl">每周哪几天</div><div class="ropts">${[1,2,3,4,5,6,7].map(w=>{const sel=f.weekdays.includes(w);return`<div class="ropt ${sel?'sel':''}" style="flex:0 0 calc(14% - 7px);padding:10px 0" onclick="toggleWeekday(${w})">${dows[w]}</div>`}).join('')}</div></div>`;h+=`<div class="fg"><div class="fl">时间</div>${f.times.map((t,i)=>`<div class="frow" style="margin-bottom:8px"><input type="time" class="fi" value="${t}" oninput="formState.times[${i}]=this.value">${f.times.length>1?`<button class="btn btn-ghost btn-sm" onclick="formState.times.splice(${i},1);rerender()">✕</button>`:''}</div>`).join('')}<button class="btn btn-ghost btn-sm" onclick="formState.times.push('18:00');rerender()">+ 添加时间</button></div>`;}else{h+=`<div class="fg"><div class="fl">每天几个时间点</div>${f.everyDayTimes.map((t,i)=>`<div class="frow" style="margin-bottom:8px"><input type="time" class="fi" value="${t}" oninput="formState.everyDayTimes[${i}]=this.value">${f.everyDayTimes.length>1?`<button class="btn btn-ghost btn-sm" onclick="formState.everyDayTimes.splice(${i},1);rerender()">✕</button>`:''}</div>`).join('')}<button class="btn btn-ghost btn-sm" onclick="formState.everyDayTimes.push('20:00');rerender()">+ 添加时间</button></div>`;}}else{h+=`<div class="hint">不固定模式下随时手动打卡，系统不预生成排期。</div>`}h+=`<div class="fg"><div class="fl">记录数值</div><div class="frow"><div class="small muted" style="flex:1">每次打卡可记录一个数值（如血压、背诵量）</div><div class="switch ${f.recordValue?'on':''}" onclick="formState.recordValue=formState.recordValue?0:1;rerender()"></div></div></div>`;if(f.recordValue){h+=`<div class="fg"><div class="fl">数值单位</div><input class="fi" value="${f.valueUnit||''}" placeholder="如 mmHg、个、ml" oninput="formState.valueUnit=this.value"></div>`}h+=`</div>`;h+=`<div style="padding:16px;display:flex;gap:10px"><button class="btn btn-ghost" style="flex:1" onclick="goStep(1)">上一步</button><button class="btn btn-fill" style="flex:1" onclick="goStep(3)">下一步</button></div>`;return h;}
function stepRemark(isEdit){const f=formState;return`<div class="card"><div class="fg"><div class="fl">备注（可选）</div><textarea class="fta" placeholder="如老师、地点、单价、注意事项..." oninput="formState.remark=this.value">${f.remark||''}</textarea></div><div class="fl">预览</div><div class="hint" style="background:var(--c-border-2);padding:14px;border-radius:11px;margin-top:8px;line-height:1.7">${previewPlan()}</div></div><div style="padding:16px;display:flex;gap:10px"><button class="btn btn-ghost" style="flex:1" onclick="goStep(2)">上一步</button><button class="btn btn-fill" style="flex:1" onclick="savePlan(${isEdit?1:0})">${isEdit?'保存':'创建计划'}</button></div>`;}
function toggleWeekday(w){const a=formState.weekdays;const i=a.indexOf(w);if(i>=0)a.splice(i,1);else a.push(w);a.sort();rerender();}
function previewPlan(){const f=formState;let s=`${TYPES[f.type].label}　${f.name||'未命名'}<br>`;if(f.totalCountMode==='limited'){s+=`共 ${f.totalCount} 次`;if(f.initialDoneCount)s+=`，起始 ${f.initialDoneCount}`;s+=`，缺勤${f.absenceConsumes?'计入':'不计入'}消耗<br>`;}else s+=`无限次<br>`;if(f.timeMode==='fixed'){if(f.scheduleType==='weekday')s+=`每周${f.weekdays.map(w=>'一二三四五六日'[w-1]).join('')} ${f.times.join('、')}`;else s+=`每天 ${f.everyDayTimes.join('、')}`;}else s+=`时间不固定`;if(f.recordValue)s+=`　记录数值（${f.valueUnit||'无单位'}）`;if(f.overdueHandling==='auto_missed')s+=`　逾期${f.overdueGraceHours}h自动缺席`;return s;}
function savePlan(isEdit){const f=formState;if(!f.name||!f.name.trim()){toast('请填写计划名称');goStep(0);return}if(f.totalCountMode==='limited'&&f.initialDoneCount>f.totalCount){toast('起始进度不能超过总次数');goStep(1);return}let rules=null;if(f.timeMode==='fixed'){if(f.scheduleType==='weekday'){if(!f.weekdays.length){toast('请选择每周哪几天');goStep(2);return}if(!f.times.length){toast('请至少添加一个时间');goStep(2);return}rules=[];for(const w of f.weekdays)for(const t of f.times)rules.push({weekday:w,time:t});}else{if(!f.everyDayTimes.length){toast('请至少添加一个时间');goStep(2);return}rules=f.everyDayTimes.map(t=>({every:'day',time:t}));}}const data={name:f.name.trim(),type:f.type,color:f.color||'#1a1a1a',totalCount:f.totalCountMode==='unlimited'?null:(f.totalCount||0),initialDoneCount:f.totalCountMode==='limited'?(f.initialDoneCount||0):0,absenceConsumes:f.absenceConsumes?1:0,timeMode:f.timeMode,scheduleConfig:rules?{rules}:null,overdueHandling:f.overdueHandling||'keep_pending',overdueGraceHours:f.overdueGraceHours||24,recordValue:f.recordValue?1:0,valueUnit:f.recordValue?(f.valueUnit||null):null,startDate:f.startDate||fmtDate(today()),remark:f.remark||null,status:'active'};if(isEdit){const p=DB.getPlan(f._id);Object.assign(p,data);ensureSchedule(p);}else{const plan={id:uid(),doneCount:0,missedCount:0,createdAt:nowISO(),deletedAt:null,...data};DB.plans.push(plan);ensureSchedule(plan);}syncAll();DB.save();formState={};toast(isEdit?'已保存':'已创建');setTimeout(()=>go('home'),400);}
function quickDone(cid){setStatus(cid,'done');toast('已打卡');vibrate(15);rerender();}
function makeupDone(cid){setStatus(cid,'done',{source:'retroactive',adjustmentType:'makeup'});toast('已补打');vibrate(15);rerender();}
let sheetState={};
function openSheet(cid){const c=DB.getCheckin(cid);if(!c)return;sheetState={checkinId:cid,remark:c.remark||'',value:c.value||'',reason:'',showMore:false};drawSheet();}
function drawSheet(){const c=DB.getCheckin(sheetState.checkinId);if(!c)return;const plan=DB.getPlan(c.planId);const isDone=c.status==='done';let h=`<div class="grip"></div><div class="sheet-title">${plan.name}</div><div class="sheet-sub">${c.scheduledDate} ${c.scheduledTime||''}　·　${statusLabel(c.status)}</div>`;if(plan.recordValue){h+=`<div class="fg"><div class="fl">数值${plan.valueUnit?'（'+plan.valueUnit+'）':''}</div><input class="fi" type="number" value="${sheetState.value}" placeholder="输入数值" oninput="sheetState.value=this.value"></div>`;}h+=`<div style="display:flex;gap:10px;margin:16px 0">`;if(!isDone)h+=`<button class="btn btn-done btn-block" onclick="sheetDone()">标记完成</button>`;if(c.status!=='missed')h+=`<button class="btn btn-miss btn-block" style="background:rgba(255,59,48,.1)" onclick="sheetMissed()">标记缺席</button>`;h+=`</div>`;if(!isDone){h+=`<div class="fl">缺席原因</div><div class="chips" style="margin-bottom:16px">${ABSENCE_REASONS.map(r=>`<div class="chip ${sheetState.reason===r?'sel':''}" onclick="sheetReason('${r}')">${r}</div>`).join('')}</div>`;}h+=`<div class="fg"><div class="fl">备注</div><textarea class="fta" placeholder="补充说明..." oninput="sheetState.remark=this.value">${sheetState.remark}</textarea></div>`;const moreOpen=sheetState.showMore;h+=`<div class="collapse-head ${moreOpen?'open':''}" onclick="sheetState.showMore=!sheetState.showMore;drawSheet()"><span>更多操作</span><span class="arrow">▼</span></div>`;if(moreOpen){if(plan.timeMode!=='flexible'){h+=`<div class="li" style="cursor:pointer;padding-left:0" onclick="closeSheet();openReschedule('${c.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="var(--c-reschedule)" stroke-width="1.7" style="width:20px;height:20px;flex-shrink:0"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4" stroke-linecap="round"/></svg><div class="lm"><div class="lt">调整排期</div><div class="ls">改到其他日期/时间</div></div><span class="muted">›</span></div>`;}if(c.status==='missed'){h+=`<div class="li" style="cursor:pointer;padding-left:0" onclick="closeSheet();makeupDone('${c.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="var(--c-retroactive)" stroke-width="1.7" style="width:20px;height:20px;flex-shrink:0"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.8 6.6 19.5l1.2-6L3.3 9.3l6.1-.7L12 3z" stroke-linejoin="round"/></svg><div class="lm"><div class="lt">补打为已完成</div><div class="ls">事后补上，标记为补录</div></div><span class="muted">›</span></div>`;}h+=`<div class="li" style="cursor:pointer;padding-left:0" onclick="revertPending('${c.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="var(--c-text-3)" stroke-width="1.7" style="width:20px;height:20px;flex-shrink:0"><path d="M3 7v6h6" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.5 13a9 9 0 1 0 2.6-7.4L3 8" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="lm"><div class="lt">撤销，改回待打卡</div></div><span class="muted">›</span></div>`;}showSheet(h);}
function sheetReason(r){if(sheetState.reason===r){sheetState.reason='';}else{sheetState.reason=r;if(!sheetState.remark)sheetState.remark=r;}drawSheet();}
function sheetDone(){const opts={};if(sheetState.remark)opts.remark=sheetState.remark;if(sheetState.value!==undefined&&sheetState.value!=='')opts.value=parseFloat(sheetState.value);setStatus(sheetState.checkinId,'done',opts);closeSheet();toast('已完成');vibrate(15);rerender();}
function sheetMissed(){setStatus(sheetState.checkinId,'missed',{remark:sheetState.reason||sheetState.remark||null});closeSheet();toast('已标记缺席');rerender();}
function revertPending(id){setStatus(id,'pending');closeSheet();toast('已撤销');rerender();}
function statusLabel(s){return s==='done'?'已完成':s==='missed'?'缺席':'待打卡'}
function openReschedule(cid){const c=DB.getCheckin(cid);sheetState={checkinId:cid,newDate:c.scheduledDate,newTime:c.scheduledTime||'08:00'};const h=`<div class="grip"></div><div class="sheet-title">调整排期</div><div class="sheet-sub">原定：${c.originalScheduledDate||c.scheduledDate} ${c.originalScheduledTime||c.scheduledTime||''}</div><div class="fg"><div class="fl">新的日期</div><input type="date" class="fi" value="${sheetState.newDate}" oninput="sheetState.newDate=this.value"></div><div class="fg"><div class="fl">新的时间</div><input type="time" class="fi" value="${sheetState.newTime}" oninput="sheetState.newTime=this.value"></div><div class="hint">原排期时间会保留记录，便于追溯。</div><div style="display:flex;gap:10px;margin-top:18px"><button class="btn btn-ghost" style="flex:1" onclick="closeSheet();openSheet('${cid}')">取消</button><button class="btn btn-fill" style="flex:1" onclick="doReschedule()">确认调整</button></div>`;showSheet(h);}
function doReschedule(){rescheduleCheckin(sheetState.checkinId,sheetState.newDate,sheetState.newTime);closeSheet();toast('已调整排期');rerender();}
function openRetro(pid){const plan=DB.getPlan(pid);sheetState={planId:pid,date:fmtDate(addDays(today(),-1)),time:plan.timeMode==='fixed'?(plan.scheduleConfig.rules[0].time):''};const h=`<div class="grip"></div><div class="sheet-title">补录</div><div class="sheet-sub">${plan.name}　事后补记一次完成</div><div class="fg"><div class="fl">日期</div><input type="date" class="fi" value="${sheetState.date}" oninput="sheetState.date=this.value"></div>${plan.timeMode==='fixed'?`<div class="fg"><div class="fl">时间</div><select class="fsel" onchange="sheetState.time=this.value">${(plan.scheduleConfig.rules||[]).map(r=>`<option value="${r.time}" ${sheetState.time===r.time?'selected':''}>${r.time}</option>`).join('')}</select></div>`:''}<div class="hint">补录会标记来源为「补录」，与实时打卡区分。</div><div style="display:flex;gap:10px;margin-top:18px"><button class="btn btn-ghost" style="flex:1" onclick="closeSheet()">取消</button><button class="btn btn-fill" style="flex:1" onclick="doRetro()">补录为已完成</button></div>`;showSheet(h);}
function doRetro(){retroactiveDone(sheetState.planId,sheetState.date,sheetState.time||null);closeSheet();toast('已补录');vibrate(15);rerender();}
function openDay(pid,date){const plan=DB.getPlan(pid);const cs=DB.planCheckins(pid).filter(c=>c.scheduledDate===date);const todayStr=fmtDate(today());let h=`<div class="grip"></div><div class="sheet-title">${date}</div><div class="sheet-sub">${plan.name}</div>`;if(cs.length){for(const c of cs){const adj=c.adjustmentType==='reschedule'?'<span class="tag adj">已调整</span>':'';const ret=c.source==='retroactive'?'<span class="tag ret">补录</span>':'';h+=`<div class="li" style="padding:14px 0"><span class="dot" style="background:${c.status==='done'?'var(--c-done)':c.status==='missed'?'var(--c-missed)':'var(--c-pending)'}"></span><div class="lm"><div class="lt">${c.scheduledTime||'全天'} · ${statusLabel(c.status)} ${adj}${ret}</div><div class="ls">${c.remark||''}${c.value?' · '+c.value:''}</div></div><button class="btn btn-ghost btn-sm" onclick="closeSheet();openSheet('${c.id}')">操作</button></div>`;}}else{h+=`<div class="hint" style="text-align:center;padding:12px">这天没有排期记录</div>`;if(date<=todayStr)h+=`<button class="btn btn-fill btn-block mt12" onclick="closeSheet();openRetro('${pid}')">+ 这天补录一次</button>`;}showSheet(h);}
function showSheet(html){let sheet=$('#sheet');if(!sheet){sheet=document.createElement('div');sheet.id='sheet';sheet.className='sheet';document.body.appendChild(sheet)}sheet.innerHTML=html;$('#overlay').classList.add('show');sheet.classList.add('show');}
function closeSheet(){$('#overlay').classList.remove('show');const sheet=$('#sheet');if(sheet)sheet.classList.remove('show');}
let curRoute={};
const routeStack=[];let isNavigatingBack=false;
function go(hash){routeStack.push(location.hash);if(routeStack.length>30)routeStack.shift();location.hash='#/'+hash;}
function goBack(){let prev=routeStack.pop();while(prev!=null&&(prev===location.hash||prev==='#'||prev===''))prev=routeStack.pop();const tabRoutes=['#/home','#/checkin','#/me'];if(prev!=null){isNavigatingBack=true;location.hash=prev;}else if(!tabRoutes.includes(location.hash))location.hash='#/home';}
function parseRoute(hash){const h=hash.replace(/^#\/?/,'')||'home';const parts=h.split('/');if(parts[0]==='home')return{name:'home'};if(parts[0]==='checkin')return{name:'checkin'};if(parts[0]==='me')return{name:'me'};if(parts[0]==='missed')return{name:'missed'};if(parts[0]==='new')return{name:'new'};if(parts[0]==='plan'){if(parts[2]==='edit')return{name:'edit',id:parts[1]};return{name:'detail',id:parts[1]};}return{name:'home'};}
function rerender(){render(curRoute)}
function render(route){curRoute=route;if(route.name!=='detail'){detailTab='progress';calMonth=null;}const header=$('#header'),page=$('#page'),tabbar=$('#tabbar');let title='',showBack=false,showTab=false,activeTab='',html='';switch(route.name){case 'home':title='今日';showTab=true;activeTab='home';html=viewHome();break;case 'checkin':title='计划';showTab=true;activeTab='checkin';html=viewCheckin();break;case 'me':title='我的';showTab=true;activeTab='me';html=viewMe();break;case 'missed':title='缺席记录';showBack=true;html=viewMissed();break;case 'new':title='新建计划';showBack=true;html=viewEdit(null);break;case 'edit':title='编辑计划';showBack=true;html=viewEdit(route.id);break;case 'detail':{const plan=DB.getPlan(route.id);title=plan?plan.name:'计划';showBack=true;html=viewDetail(route.id);break;}}let hh=`<div class="back" onclick="goBack()">${showBack?'‹':''}</div>`;hh+=`<div class="title">${title}</div>`;if(route.name==='detail')hh+=`<div class="action right" onclick="go('plan/${route.id}/edit')">编辑</div>`;else hh+=`<div class="action right"></div>`;header.innerHTML=hh;page.className='page'+(showTab?'':' no-tab');page.innerHTML=html;tabbar.style.display=showTab?'flex':'none';if(showTab){$$('.tab',tabbar).forEach(t=>{t.classList.toggle('active',t.dataset.route===activeTab);t.innerHTML=`${tabIcon(t.dataset.route)}<span>${({home:'今日',checkin:'计划',me:'我的'})[t.dataset.route]}</span>`;});}page.scrollTop=0;}
function router(){const route=parseRoute(location.hash);if(route.name==='detail'){const plan=DB.getPlan(route.id);if(plan){ensureSchedule(plan);syncPlanCounts(route.id)}}if(route.name==='new'){formState={_init:true,step:0,name:'',type:'course',color:'#007AFF',totalCountMode:'limited',totalCount:60,initialDoneCount:0,absenceConsumes:0,timeMode:'fixed',scheduleType:'weekday',weekdays:[2,6],times:['18:00'],everyDayTimes:['08:00'],overdueHandling:'keep_pending',overdueGraceHours:24,recordValue:0,valueUnit:'',startDate:fmtDate(today()),remark:''};}isNavigatingBack=false;render(route);}
function makeSampleData(){DB.plans=[];DB.checkins=[];const t=today();const ts=fmtDate(t);const piano={id:uid(),name:'钢琴课',type:'course',color:'#AF52DE',totalCount:60,initialDoneCount:18,doneCount:0,missedCount:0,absenceConsumes:0,timeMode:'fixed',scheduleConfig:{rules:[{weekday:2,time:'18:00'},{weekday:6,time:'10:00'}]},overdueHandling:'keep_pending',overdueGraceHours:24,recordValue:0,valueUnit:null,startDate:fmtDate(addDays(t,-42)),status:'active',remark:'周老师',createdAt:nowISO(),deletedAt:null};DB.plans.push(piano);const vitamin={id:uid(),name:'每日维生素',type:'medicine',color:'#34C759',totalCount:90,initialDoneCount:0,doneCount:0,missedCount:0,absenceConsumes:1,timeMode:'fixed',scheduleConfig:{rules:[{every:'day',time:'08:00'}]},overdueHandling:'auto_missed',overdueGraceHours:24,recordValue:0,valueUnit:null,startDate:fmtDate(addDays(t,-20)),status:'active',remark:'早餐后',createdAt:nowISO(),deletedAt:null};DB.plans.push(vitamin);const bp={id:uid(),name:'量血压',type:'measure',color:'#FF3B30',totalCount:null,initialDoneCount:0,doneCount:0,missedCount:0,absenceConsumes:0,timeMode:'fixed',scheduleConfig:{rules:[{every:'day',time:'08:00'},{every:'day',time:'20:00'}]},overdueHandling:'auto_missed',overdueGraceHours:12,recordValue:1,valueUnit:'mmHg',startDate:fmtDate(addDays(t,-10)),status:'active',remark:'收缩压',createdAt:nowISO(),deletedAt:null};DB.plans.push(bp);DB.plans.forEach(p=>ensureSchedule(p));for(const c of DB.checkins){if(c.scheduledDate>=ts)continue;if(c.planId===piano.id){if(c.scheduledDate===fmtDate(addDays(t,-7))){c.status='missed';c.remark='生病发烧';}else if(c.scheduledDate<fmtDate(addDays(t,-1))){c.status='done';c.actualTime=c.scheduledDate+'T18:05:00';}}else if(c.planId===vitamin.id){if(c.scheduledDate===fmtDate(addDays(t,-3))){}else if(c.scheduledDate<fmtDate(addDays(t,-1))){c.status='done';c.actualTime=c.scheduledDate+'T08:10:00';}}else if(c.planId===bp.id){if(c.scheduledDate===fmtDate(addDays(t,-2))&&c.scheduledTime==='20:00'){}else if(c.scheduledDate<ts){c.status='done';c.actualTime=c.scheduledDate+'T'+c.scheduledTime+':00';c.value=Math.round(115+Math.random()*20);}}}syncAll();DB.save();}
function resetSample(){if(!confirm('重置为示例数据？当前数据将被覆盖。'))return;makeSampleData();processOverdue();syncAll();DB.save();calMonth=null;go('home');toast('已重置');}
function clearAll(){if(!confirm('清空所有数据？此操作不可恢复。'))return;DB.plans=[];DB.checkins=[];DB.save();go('home');toast('已清空');}
function init(){if(!DB.load()||!DB.plans.length)makeSampleData();processOverdue();syncAll();DB.save();$$('.tab').forEach(t=>t.addEventListener('click',()=>go(t.dataset.route)));$('#overlay').addEventListener('click',closeSheet);window.addEventListener('hashchange',router);if(!location.hash)location.hash='#/home';else router();}
init();
</script>
</body>
